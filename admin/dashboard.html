<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #0f2347;
        }

        .dashboard {
            width: 100%;
            max-width: 1030px;
            margin: auto;
            padding: 32px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        .welcome-text {
            margin: 0;
            color: #667085;
        }

        #admin-email {
            color: #0f2347;
            font-weight: bold;
        }

        .logout-button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #b91c1c;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .dashboard-card {
            padding: 25px;
            border: 1px solid #e4e7ec;
            border-radius: 12px;
            background: #f9fafb;
        }

        .dashboard-card h2 {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .dashboard-card p {
            margin: 0 0 20px;
            color: #667085;
            line-height: 1.6;
        }

        .card-button {
            display: inline-block;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .card-button:hover {
            background: #1d4ed8;
        }

        .card-button.disabled {
            background: #98a2b3;
            cursor: not-allowed;
        }

        .status-message {
            display: none;
            margin-bottom: 25px;
            padding: 14px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
        }

        @media screen and (max-width: 760px) {
            body {
                padding: 20px 14px;
            }

            .dashboard {
                padding: 24px 20px;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logout-button {
                width: 100%;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="dashboard">
        <div id="status-message" class="status-message"></div>

        <header class="dashboard-header">
            <div>
                <h1>Admin Dashboard</h1>

                <p class="welcome-text">
                    You are logged in as
                    <span id="admin-email">Loading...</span>
                </p>
            </div>

            <button
                type="button"
                id="logout-button"
                class="logout-button"
            >
                Log out
            </button>
        </header>

        <section class="dashboard-grid">
            <article class="dashboard-card">
                <h2>Create a Post</h2>

                <p>
                    Write and publish a new article for your blog.
                </p>

                <button
                    type="button"
                    class="card-button disabled"
                    disabled
                >
                    Coming Next
                </button>
            </article>

            <article class="dashboard-card">
                <h2>Manage Posts</h2>

                <p>
                    Edit, publish, hide, or delete your existing posts.
                </p>

                <button
                    type="button"
                    class="card-button disabled"
                    disabled
                >
                    Coming Next
                </button>
            </article>

            <article class="dashboard-card">
                <h2>View Website</h2>

                <p>
                    Open the public version of John's Blog.
                </p>

                <a href="../index.html" class="card-button">
                    Visit Website
                </a>
            </article>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        /*
         * Copy the exact sb_publishable key
         * from your working login.html.
         */
        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        const adminEmail =
            document.getElementById("admin-email");

        const logoutButton =
            document.getElementById("logout-button");

        const statusMessage =
            document.getElementById("status-message");

        function showError(message) {
            statusMessage.textContent = message;
            statusMessage.style.display = "block";
        }

        async function protectDashboard() {
            try {
                const {
                    data: { user },
                    error
                } = await supabaseClient.auth.getUser();

                if (error || !user) {
                    window.location.replace("login.html");
                    return;
                }

                adminEmail.textContent =
                    user.email || "Admin";
            } catch (error) {
                console.error(
                    "Authentication error:",
                    error
                );

                showError(
                    "Unable to verify your login. Returning to the login page."
                );

                setTimeout(function () {
                    window.location.replace("login.html");
                }, 1500);
            }
        }

        logoutButton.addEventListener(
            "click",
            async function () {
                logoutButton.disabled = true;
                logoutButton.textContent = "Logging out...";

                try {
                    const { error } =
                        await supabaseClient.auth.signOut();

                    if (error) {
                        throw error;
                    }

                    window.location.replace("login.html");
                } catch (error) {
                    console.error(
                        "Logout error:",
                        error
                    );

                    showError(
                        error.message || "Unable to log out."
                    );

                    logoutButton.disabled = false;
                    logoutButton.textContent = "Log out";
                }
            }
        );

        protectDashboard();
    </script>
</body>
</html>
