<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Posts | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #0f2347;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .button {
            display: inline-block;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            background: #e5e7eb;
            color: #111827;
        }

        .secondary-button:hover {
            background: #d1d5db;
        }

        #message {
            display: none;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 8px;
        }

        .success-message {
            display: block !important;
            background: #dcfce7;
            color: #15803d;
        }

        .error-message {
            display: block !important;
            background: #fee2e2;
            color: #dc2626;
        }

        .posts-list {
            display: grid;
            gap: 18px;
        }

        .post-card {
            padding: 24px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .post-title {
            margin: 0 0 8px;
            font-size: 23px;
        }

        .post-excerpt {
            margin: 0 0 15px;
            color: #667085;
            line-height: 1.6;
        }

        .post-meta {
            color: #667085;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .published {
            background: #dcfce7;
            color: #15803d;
        }

        .draft {
            background: #fef3c7;
            color: #92400e;
        }

        .post-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .action-button {
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .publish-button {
            background: #2563eb;
            color: white;
        }

        .edit-button {
            background: #e5e7eb;
            color: #111827;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        .empty-state {
            padding: 50px 20px;
            text-align: center;
            background: white;
            border-radius: 14px;
            color: #667085;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667085;
        }

        @media screen and (max-width: 650px) {
            body {
                padding: 20px 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .top-actions {
                flex-direction: column;
            }

            .button {
                text-align: center;
            }

            .post-header {
                flex-direction: column;
            }

            .post-actions {
                flex-direction: column;
            }

            .action-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top-bar">

            <h1>Manage Posts</h1>

            <div class="top-actions">

                <a
                    href="create-post.html"
                    class="button"
                >
                    + New Post
                </a>

                <a
                    href="dashboard.html"
                    class="button secondary-button"
                >
                    ← Dashboard
                </a>

            </div>

        </div>

        <div id="message"></div>

        <section
            id="posts-list"
            class="posts-list"
        >
            <div class="loading">
                Loading posts...
            </div>
        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const postsList =
            document.getElementById("posts-list");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                type === "success"
                    ? "success-message"
                    : "error-message";


            setTimeout(function () {

                message.className = "";
                message.textContent = "";

            }, 3000);
        }


        async function getCurrentUser() {

            const {
                data: { user },
                error
            } =
                await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            return user;
        }


        function formatDate(dateString) {

            const date =
                new Date(dateString);


            return date.toLocaleDateString(
                undefined,
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
        }


        async function loadPosts() {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("posts")
                    .select("*")
                    .eq("author_id", user.id)
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(error);

                postsList.innerHTML =
                    "<div class='empty-state'>Unable to load posts.</div>";

                return;
            }


            if (!data || data.length === 0) {

                postsList.innerHTML = `
                    <div class="empty-state">
                        <h2>No posts yet</h2>

                        <p>
                            Create your first blog post from
                            the admin dashboard.
                        </p>
                    </div>
                `;

                return;
            }


            postsList.innerHTML = "";


            data.forEach(function (post) {

                const card =
                    document.createElement("article");


                card.className =
                    "post-card";


                const safeTitle =
                    escapeHTML(post.title || "");


                const safeExcerpt =
                    escapeHTML(post.excerpt || "");


                card.innerHTML = `

                    <div class="post-header">

                        <div>

                            <h2 class="post-title">
                                ${safeTitle}
                            </h2>

                            <p class="post-excerpt">
                                ${
                                    safeExcerpt ||
                                    "No description."
                                }
                            </p>

                            <div class="post-meta">
                                Created:
                                ${formatDate(post.created_at)}
                            </div>

                        </div>

                        <span
                            class="status ${
                                post.published
                                    ? "published"
                                    : "draft"
                            }"
                        >

                            ${
                                post.published
                                    ? "Published"
                                    : "Draft"
                            }

                        </span>

                    </div>


                    <div class="post-actions">

                        <button
                            class="action-button publish-button"
                            data-action="publish"
                            data-id="${post.id}"
                            data-published="${post.published}"
                        >

                            ${
                                post.published
                                    ? "Unpublish"
                                    : "Publish"
                            }

                        </button>


                        <button
                            class="action-button edit-button"
                            data-action="edit"
                            data-id="${post.id}"
                        >
                            Edit
                        </button>


                        <button
                            class="action-button delete-button"
                            data-action="delete"
                            data-id="${post.id}"
                        >
                            Delete
                        </button>

                    </div>
                `;


                postsList.appendChild(card);
            });
        }


        function escapeHTML(value) {

            const element =
                document.createElement("div");

            element.textContent = value;

            return element.innerHTML;
        }


        postsList.addEventListener(
            "click",
            async function (event) {

                const button =
                    event.target.closest(
                        "[data-action]"
                    );


                if (!button) {
                    return;
                }


                const action =
                    button.dataset.action;

                const postId =
                    button.dataset.id;


                if (action === "publish") {

                    const currentlyPublished =
                        button.dataset.published ===
                        "true";


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("posts")
                            .update({
                                published:
                                    !currentlyPublished
                            })
                            .eq(
                                "id",
                                postId
                            );


                    if (error) {

                        console.error(error);

                        showMessage(
                            error.message,
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        currentlyPublished
                            ? "Post changed to draft."
                            : "Post published successfully!",
                        "success"
                    );


                    loadPosts();
                }


                if (action === "edit") {

                    window.location.href =
                        "edit-post.html?id=" +
                        encodeURIComponent(postId);
                }


                if (action === "delete") {

                    const confirmed =
                        window.confirm(
                            "Are you sure you want to delete this post?"
                        );


                    if (!confirmed) {
                        return;
                    }


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("posts")
                            .delete()
                            .eq(
                                "id",
                                postId
                            );


                    if (error) {

                        console.error(error);

                        showMessage(
                            error.message,
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        "Post deleted successfully.",
                        "success"
                    );


                    loadPosts();
                }
            }
        );


        loadPosts();

    </script>

</body>
</html>
