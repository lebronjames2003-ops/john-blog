<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #0f2347;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .back-button {
            padding: 11px 16px;
            border-radius: 8px;
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            font-weight: bold;
        }

        .profile-form {
            padding: 30px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        #short-intro {
            min-height: 110px;
        }

        #about-text {
            min-height: 220px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        .save-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .save-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #667085;
        }

        @media screen and (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .back-button {
                text-align: center;
            }

            .profile-form {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top-bar">

            <h1>Edit Profile</h1>

            <a
                href="dashboard.html"
                class="back-button"
            >
                ← Dashboard
            </a>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Loading your profile...
        </div>


        <form
            id="profile-form"
            class="profile-form"
            style="display: none;"
        >

            <div class="form-group">

                <label for="display-name">
                    Display Name
                </label>

                <input
                    type="text"
                    id="display-name"
                    placeholder="John"
                    required
                >

            </div>


            <div class="form-group">

                <label for="headline">
                    Headline
                </label>

                <input
                    type="text"
                    id="headline"
                    placeholder="Student • Technology • Personal Blog"
                >

            </div>


            <div class="form-group">

                <label for="short-intro">
                    Homepage Introduction
                </label>

                <textarea
                    id="short-intro"
                    placeholder="Write a short introduction about yourself..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="about-title">
                    About Me Title
                </label>

                <input
                    type="text"
                    id="about-title"
                    placeholder="A little information about me"
                >

            </div>


            <div class="form-group">

                <label for="about-text">
                    About Me Description
                </label>

                <textarea
                    id="about-text"
                    placeholder="Write your About Me information..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="profile-image">
                    Profile Image URL
                </label>

                <input
                    type="url"
                    id="profile-image"
                    placeholder="https://example.com/profile.jpg"
                >

            </div>


            <button
                type="submit"
                id="save-button"
                class="save-button"
            >
                Save Profile
            </button>


            <div id="message"></div>

        </form>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script>

        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const profileForm =
            document.getElementById(
                "profile-form"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const saveButton =
            document.getElementById(
                "save-button"
            );

        const message =
            document.getElementById(
                "message"
            );


        const displayName =
            document.getElementById(
                "display-name"
            );

        const headline =
            document.getElementById(
                "headline"
            );

        const shortIntro =
            document.getElementById(
                "short-intro"
            );

        const aboutTitle =
            document.getElementById(
                "about-title"
            );

        const aboutText =
            document.getElementById(
                "about-text"
            );

        const profileImage =
            document.getElementById(
                "profile-image"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;
        }


        async function getCurrentUser() {

            const {
                data: { user },
                error
            } =
                await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            return user;
        }


        async function loadProfile() {

            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("site_profile")
                    .select("*")
                    .eq(
                        "id",
                        user.id
                    )
                    .maybeSingle();


            if (error) {

                console.error(
                    "Profile load error:",
                    error
                );

                loading.textContent =
                    "Unable to load profile.";

                return;
            }


            if (data) {

                displayName.value =
                    data.display_name || "";

                headline.value =
                    data.headline || "";

                shortIntro.value =
                    data.short_intro || "";

                aboutTitle.value =
                    data.about_title || "";

                aboutText.value =
                    data.about_text || "";

                profileImage.value =
                    data.profile_image_url || "";
            }


            loading.style.display =
                "none";

            profileForm.style.display =
                "block";
        }


        profileForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                saveButton.disabled =
                    true;

                saveButton.textContent =
                    "Saving...";

                showMessage("", "");


                try {

                    const user =
                        await getCurrentUser();


                    if (!user) {
                        return;
                    }


                    const profileData = {

                        id:
                            user.id,

                        display_name:
                            displayName.value.trim(),

                        headline:
                            headline.value.trim(),

                        short_intro:
                            shortIntro.value.trim(),

                        about_title:
                            aboutTitle.value.trim(),

                        about_text:
                            aboutText.value.trim(),

                        profile_image_url:
                            profileImage.value.trim(),

                        updated_at:
                            new Date().toISOString()
                    };


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("site_profile")
                            .upsert(
                                profileData,
                                {
                                    onConflict: "id"
                                }
                            );


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "Profile saved successfully!",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Profile save error:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Unable to save profile.",
                        "error"
                    );


                } finally {

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "Save Profile";
                }
            }
        );


        loadProfile();

    </script>

</body>
</html>
