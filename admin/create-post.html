<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Post | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #0f2347;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .back-button {
            padding: 10px 16px;
            border-radius: 8px;
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            font-weight: bold;
        }

        .post-form {
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        #excerpt {
            min-height: 100px;
        }

        #content {
            min-height: 300px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .checkbox-row input {
            width: auto;
        }

        .checkbox-row label {
            margin: 0;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        @media screen and (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .back-button {
                text-align: center;
            }

            .post-form {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top-bar">
            <h1>Create New Post</h1>

            <a
                href="dashboard.html"
                class="back-button"
            >
                ← Dashboard
            </a>
        </div>

        <form id="post-form" class="post-form">

            <div class="form-group">
                <label for="title">
                    Post Title
                </label>

                <input
                    type="text"
                    id="title"
                    required
                    placeholder="Example: My First Blog Post"
                >
            </div>

            <div class="form-group">
                <label for="slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    required
                    placeholder="my-first-blog-post"
                >
            </div>

            <div class="form-group">
                <label for="excerpt">
                    Short Description
                </label>

                <textarea
                    id="excerpt"
                    placeholder="Write a short description..."
                ></textarea>
            </div>

            <div class="form-group">
                <label for="image-url">
                    Image URL
                </label>

                <input
                    type="url"
                    id="image-url"
                    placeholder="https://example.com/image.jpg"
                >
            </div>

            <div class="form-group">
                <label for="content">
                    Article Content
                </label>

                <textarea
                    id="content"
                    required
                    placeholder="Write your complete article here..."
                ></textarea>
            </div>

            <div class="checkbox-row">
                <input
                    type="checkbox"
                    id="published"
                >

                <label for="published">
                    Publish immediately
                </label>
            </div>

            <button
                type="submit"
                id="submit-button"
                class="submit-button"
            >
                Save Post
            </button>

            <div id="message"></div>

        </form>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const postForm =
            document.getElementById("post-form");

        const titleInput =
            document.getElementById("title");

        const slugInput =
            document.getElementById("slug");

        const submitButton =
            document.getElementById("submit-button");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }


        function createSlug(title) {
            return title
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");
        }


        titleInput.addEventListener(
            "input",
            function () {

                slugInput.value =
                    createSlug(titleInput.value);
            }
        );


        async function protectPage() {

            const {
                data: { user },
                error
            } =
                await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            return user;
        }


        postForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                submitButton.disabled = true;

                submitButton.textContent =
                    "Saving...";

                showMessage("", "");


                try {

                    const user =
                        await protectPage();


                    if (!user) {
                        return;
                    }


                    const title =
                        titleInput.value.trim();

                    const slug =
                        slugInput.value.trim();

                    const excerpt =
                        document
                            .getElementById("excerpt")
                            .value
                            .trim();

                    const content =
                        document
                            .getElementById("content")
                            .value
                            .trim();

                    const imageUrl =
                        document
                            .getElementById("image-url")
                            .value
                            .trim();

                    const published =
                        document
                            .getElementById("published")
                            .checked;


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from("posts")
                            .insert([
                                {
                                    author_id: user.id,
                                    title: title,
                                    slug: slug,
                                    excerpt: excerpt,
                                    content: content,
                                    image_url: imageUrl,
                                    published: published
                                }
                            ])
                            .select();


                    if (error) {
                        throw error;
                    }


                    console.log(
                        "Created post:",
                        data
                    );


                    showMessage(
                        published
                            ? "Post published successfully!"
                            : "Draft saved successfully!",
                        "success"
                    );


                    postForm.reset();


                } catch (error) {

                    console.error(
                        "Create post error:",
                        error
                    );


                    if (
                        error.message &&
                        error.message.includes(
                            "duplicate key"
                        )
                    ) {

                        showMessage(
                            "That slug already exists. Please use another one.",
                            "error"
                        );

                    } else {

                        showMessage(
                            error.message ||
                            "Unable to save the post.",
                            "error"
                        );
                    }

                } finally {

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Save Post";
                }
            }
        );


        protectPage();
    </script>

</body>
</html>
