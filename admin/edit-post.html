<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Post | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #0f2347;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-bar h1 {
            margin: 0;
        }

        .back-button {
            padding: 10px 16px;
            border-radius: 8px;
            background: #e5e7eb;
            color: #111827;
            text-decoration: none;
            font-weight: bold;
        }

        .post-form {
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        #excerpt {
            min-height: 100px;
        }

        #content {
            min-height: 300px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .checkbox-row input {
            width: auto;
        }

        .checkbox-row label {
            margin: 0;
        }

        .save-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .save-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            padding: 40px;
            text-align: center;
            color: #667085;
        }

        @media screen and (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .back-button {
                text-align: center;
            }

            .post-form {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top-bar">

            <h1>Edit Post</h1>

            <a
                href="manage-posts.html"
                class="back-button"
            >
                ← Manage Posts
            </a>

        </div>

        <div id="loading" class="loading">
            Loading post...
        </div>

        <form
            id="post-form"
            class="post-form"
            style="display: none;"
        >

            <div class="form-group">

                <label for="title">
                    Post Title
                </label>

                <input
                    type="text"
                    id="title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="slug">
                    Slug
                </label>

                <input
                    type="text"
                    id="slug"
                    required
                >

            </div>


            <div class="form-group">

                <label for="excerpt">
                    Short Description
                </label>

                <textarea id="excerpt"></textarea>

            </div>


            <div class="form-group">

                <label for="image-url">
                    Image URL
                </label>

                <input
                    type="url"
                    id="image-url"
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Article Content
                </label>

                <textarea
                    id="content"
                    required
                ></textarea>

            </div>


            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="published"
                >

                <label for="published">
                    Published
                </label>

            </div>


            <button
                type="submit"
                id="save-button"
                class="save-button"
            >
                Save Changes
            </button>


            <div id="message"></div>

        </form>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        const form =
            document.getElementById("post-form");

        const loading =
            document.getElementById("loading");

        const message =
            document.getElementById("message");

        const saveButton =
            document.getElementById("save-button");


        const titleInput =
            document.getElementById("title");

        const slugInput =
            document.getElementById("slug");

        const excerptInput =
            document.getElementById("excerpt");

        const imageInput =
            document.getElementById("image-url");

        const contentInput =
            document.getElementById("content");

        const publishedInput =
            document.getElementById("published");


        const urlParameters =
            new URLSearchParams(
                window.location.search
            );


        const postId =
            urlParameters.get("id");


        function showMessage(text, type) {

            message.textContent = text;

            message.className = type;
        }


        async function getCurrentUser() {

            const {
                data: { user },
                error
            } =
                await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.replace(
                    "login.html"
                );

                return null;
            }


            return user;
        }


        async function loadPost() {

            if (!postId) {

                loading.textContent =
                    "Post ID is missing.";

                return;
            }


            const user =
                await getCurrentUser();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("posts")
                    .select("*")
                    .eq("id", postId)
                    .eq("author_id", user.id)
                    .single();


            if (error) {

                console.error(error);

                loading.textContent =
                    "Unable to load this post.";

                return;
            }


            titleInput.value =
                data.title || "";

            slugInput.value =
                data.slug || "";

            excerptInput.value =
                data.excerpt || "";

            imageInput.value =
                data.image_url || "";

            contentInput.value =
                data.content || "";

            publishedInput.checked =
                data.published === true;


            loading.style.display =
                "none";

            form.style.display =
                "block";
        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                saveButton.disabled = true;

                saveButton.textContent =
                    "Saving...";

                showMessage("", "");


                try {

                    const user =
                        await getCurrentUser();


                    if (!user) {
                        return;
                    }


                    const updatedPost = {

                        title:
                            titleInput.value.trim(),

                        slug:
                            slugInput.value.trim(),

                        excerpt:
                            excerptInput.value.trim(),

                        image_url:
                            imageInput.value.trim(),

                        content:
                            contentInput.value.trim(),

                        published:
                            publishedInput.checked
                    };


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("posts")
                            .update(updatedPost)
                            .eq("id", postId)
                            .eq(
                                "author_id",
                                user.id
                            );


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "Post updated successfully!",
                        "success"
                    );


                    setTimeout(function () {

                        window.location.href =
                            "manage-posts.html";

                    }, 800);


                } catch (error) {

                    console.error(
                        "Update error:",
                        error
                    );


                    if (
                        error.message &&
                        error.message.includes(
                            "duplicate key"
                        )
                    ) {

                        showMessage(
                            "That slug is already being used by another post.",
                            "error"
                        );

                    } else {

                        showMessage(
                            error.message ||
                            "Unable to update the post.",
                            "error"
                        );
                    }


                } finally {

                    saveButton.disabled = false;

                    saveButton.textContent =
                        "Save Changes";
                }
            }
        );


        loadPost();

    </script>

</body>
</html>
