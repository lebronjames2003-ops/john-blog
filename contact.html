<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | John's Blog</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="header-container">

            <a href="index.html" class="logo">John's Blog</a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="posts.html">My Posts</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>

        </div>
    </header>

    <main class="contact-page">

        <section class="contact-section">

            <p class="section-label">CONTACT</p>

            <h1>Get in touch with me</h1>

            <div class="contact-container">

                <div class="contact-info">
                    <h2>Let’s Connect</h2>

                    <p>
                        Have a question, suggestion, or project idea?
                        Feel free to send me a message using the form.
                    </p>

                    <p>
                        I will do my best to respond as soon as possible.
                    </p>
                </div>

                <form class="contact-form">

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message"
                        required
                    ></textarea>

                    <button type="submit" class="contact-button">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
