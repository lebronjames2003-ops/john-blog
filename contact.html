<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact | John's Blog</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="header-container">

            <a href="index.html" class="logo">
                John's Blog
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="posts.html">My Posts</a>
                <a href="contact.html" class="active">
                    Contact
                </a>
            </nav>

        </div>
    </header>


    <main class="contact-page">

        <section class="contact-section">

            <p class="section-label">
                CONTACT
            </p>

            <h1>
                Get in touch with me
            </h1>


            <div class="contact-container">

                <!-- LEFT SIDE -->
                <div class="contact-info">

                    <h2>
                        Let’s Connect
                    </h2>

                    <p>
                        Have a question, suggestion, or project idea?
                        Feel free to send me a message using the form.
                    </p>

                    <p>
                        I will do my best to respond as soon as possible.
                    </p>

                </div>


                <!-- CONTACT FORM -->
                <form
                    class="contact-form"
                    id="contact-form"
                >

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        maxlength="100"
                        required
                    >


                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        maxlength="200"
                        required
                    >


                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message"
                        maxlength="2000"
                        required
                    ></textarea>


                    <button
                        type="submit"
                        class="contact-button"
                        id="send-button"
                    >
                        Send Message
                    </button>


                    <!-- SUCCESS / ERROR MESSAGE -->
                    <p
                        id="form-message"
                        aria-live="polite"
                        style="
                            margin-top: 15px;
                            margin-bottom: 0;
                            font-weight: bold;
                        "
                    ></p>

                </form>

            </div>

        </section>

    </main>


    <!-- Your normal website JavaScript -->
    <script src="script.js"></script>


    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script>

        /*
        =====================================
        SUPABASE CONNECTION
        =====================================
        */

        const SUPABASE_URL =
            "https://mfvatxtvhxnzpdjecygn.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_pLh5v9s8fcjrZnVwjPg3zA_0z5afFFz";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /*
        =====================================
        CONTACT FORM
        =====================================
        */

        const contactForm =
            document.getElementById(
                "contact-form"
            );

        const sendButton =
            document.getElementById(
                "send-button"
            );

        const formMessage =
            document.getElementById(
                "form-message"
            );


        function showFormMessage(
            text,
            type
        ) {

            formMessage.textContent =
                text;


            if (type === "success") {

                formMessage.style.color =
                    "#15803d";

            } else {

                formMessage.style.color =
                    "#dc2626";
            }
        }


        /*
        =====================================
        SEND MESSAGE TO SUPABASE
        =====================================
        */

        contactForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const message =
                    document
                        .getElementById("message")
                        .value
                        .trim();


                /*
                Make sure fields are not empty
                */

                if (
                    !name ||
                    !email ||
                    !message
                ) {

                    showFormMessage(
                        "Please complete all fields.",
                        "error"
                    );

                    return;
                }


                /*
                Disable button while sending
                */

                sendButton.disabled =
                    true;

                sendButton.textContent =
                    "Sending...";

                formMessage.textContent =
                    "";


                try {

                    /*
                    Save the message
                    */

                    const { error } =
                        await supabaseClient
                            .from("messages")
                            .insert([
                                {
                                    name: name,
                                    email: email,
                                    message: message
                                }
                            ]);


                    if (error) {
                        throw error;
                    }


                    /*
                    Success
                    */

                    showFormMessage(
                        "Message sent successfully! Thank you.",
                        "success"
                    );


                    /*
                    Clear fields
                    */

                    contactForm.reset();


                } catch (error) {

                    console.error(
                        "Contact form error:",
                        error
                    );


                    showFormMessage(
                        "Unable to send your message. Please try again.",
                        "error"
                    );


                } finally {

                    /*
                    Enable button again
                    */

                    sendButton.disabled =
                        false;

                    sendButton.textContent =
                        "Send Message";
                }
            }
        );

    </script>

</body>
</html>
