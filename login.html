<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | John's Blog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.1);
        }

        .login-card h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .login-card p {
            margin: 0 0 25px;
            text-align: center;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #login-message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
        }

        .error-message {
            color: #dc2626;
        }

        .success-message {
            color: #15803d;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Admin Login</h1>
        <p>Manage John's Blog</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="login-button">
                Log in
            </button>

            <div id="login-message" aria-live="polite"></div>
        </form>

        <a href="../index.html" class="back-link">
            ← Return to website
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
